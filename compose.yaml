services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "8080:80"


    depends_on:
      - backend

    restart: unless-stopped

  docs:
    build:
      context: ./docs-site
      dockerfile: Dockerfile

    ports:
      - "8081:8000"

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-helpdesk_lite}
      DB_USER: ${MYSQL_USER:-helpdesk_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-helpdesk_dev}

      # Authenticated SMTP configuration for transactional email.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-HelpDesk Lite}

    volumes:
      - ticket_uploads:/var/www/uploads  

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped


  db:
    image: helpdesk-lite-mysql:8.4

    build:
      context: ./database
      dockerfile: Dockerfile

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-helpdesk_lite}
      MYSQL_USER: ${MYSQL_USER:-helpdesk_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-helpdesk_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-helpdesk_root_password}

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

    restart: unless-stopped



volumes:
  db_data:
  ticket_uploads: