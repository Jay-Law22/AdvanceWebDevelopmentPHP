server {
    listen 80;
    server_name _;
    client_max_body_size 35m;

    root /usr/share/nginx/html;
    index index.html;

    # Serve CSS, JavaScript, icons, and other static assets.
    location /assets/ {
        try_files $uri =404;
    }

    # Send the root route to the PHP application.
    location = / {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /;

        fastcgi_pass backend:9000;
    }

    # Serve an existing static file or pass the request to PHP.
    location / {
        try_files $uri @php_application;
    }

    # PHP handles application routes such as /dashboard and /tickets.
    location @php_application {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;

        fastcgi_pass backend:9000;
    }
}